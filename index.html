
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidhya Collection</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#FFF8FB;color:#222;}
header{
background:#fff;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
position:sticky;
top:0;
}
.logo{
font-size:28px;
font-weight:bold;
color:#E91E63;
}
.hero{
height:80vh;
background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url("https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=1200") center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}
.hero h1{font-size:42px;}
.hero p{margin:15px 0;}
.btn{
display:inline-block;
background:#E91E63;
color:white;
padding:12px 30px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}
.section{
max-width:1100px;
margin:auto;
padding:40px 20px;
}
.title{
text-align:center;
color:#C2185B;
margin-bottom:25px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:20px;
}
.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.card img{
width:100%;
height:220px;
object-fit:cover;
}
.info{padding:12px;}
.price{
color:#E91E63;
font-weight:bold;
}
footer{
background:#111;
color:white;
text-align:center;
padding:30px 20px;
}
.whatsapp{
position:fixed;
bottom:18px;
right:18px;
background:#25D366;
color:white;
padding:14px 18px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}
@media(max-width:600px){
.hero h1{font-size:32px;}
}
</style>
</head>

<body>

<header>
<div class="logo">VIDHYA COLLECTION</div>
</header>

<section class="hero">
<div>
<h1>New Collection 2026</h1>
<p>Premium Women's Fashion • Tops • Kurtis • Dresses</p>
<a class="btn" href="#shop">Shop Now</a>
</div>
</section>

<section class="section" id="shop">
<h2 class="title">Best Sellers</h2>

<div class="grid" id="productGrid">

<div class="card">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500">
<div class="info">
<h3>Floral Top</h3>
<div class="price">₹299</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500">
<div class="info">
<h3>Elegant Kurti</h3>
<div class="price">₹499</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1492707892479-7bc8d5a4ee93?w=500">
<div class="info">
<h3>Party Dress</h3>
<div class="price">₹799</div>
</div>
</div>

</div>
</section>

<footer>
<h2>Vidhya Collection</h2>
<p>Instagram: @vidhya__collection</p>
<p>Contact: 8319303760</p>
</footer>

<a class="whatsapp" href="https://wa.me/918319303760">WhatsApp</a>

<script type="module">
// Load live products from Firestore. If Firebase is not configured
// or there are no products, the static "Best Sellers" cards remain.
import { db, isConfigured } from "./firebase-config.js"
import {
  collection, getDocs, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"

if (isConfigured) {
  ;(async () => {
    try {
      const ref = collection(db, "products")
      let snap
      try { snap = await getDocs(query(ref, orderBy("createdAt", "desc"))) }
      catch (_) { snap = await getDocs(ref) }

      const products = []
      snap.forEach(d => products.push(d.data()))
      if (!products.length) return

      const grid = document.getElementById("productGrid")
      grid.innerHTML = products.map(p => {
        const soldOut = Number(p.stock) <= 0
        const wa = "https://wa.me/918319303760?text=" +
          encodeURIComponent("Hi! I'm interested in " + (p.name || "a product") + " (₹" + p.price + ")")
        return `
          <div class="card">
            <img src="${p.imageUrl || ""}" alt="${p.name || "Product"}">
            <div class="info">
              <h3>${p.name || ""}</h3>
              <div class="price">₹${p.price}</div>
              ${soldOut
                ? '<div style="color:#c62828;font-weight:bold;margin-top:6px">Out of stock</div>'
                : '<a class="btn" style="margin-top:8px;padding:8px 18px;font-size:13px" href="' + wa + '">Enquire</a>'}
            </div>
          </div>`
      }).join("")
    } catch (err) {
      console.log("[v0] storefront product load skipped:", err.message)
    }
  })()
}
</script>

</body>
</html>
