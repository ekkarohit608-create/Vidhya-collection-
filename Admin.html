<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidhya Collection - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff7fa,#ffe4ef);
  color:#351923;
  min-height:100vh;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:380px;
  background:#fff;
  padding:35px 25px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(139,22,72,.15);
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#8b1648,#e879a2);
  color:white;
  font-size:25px;
  font-weight:bold;
}

.login h1{
  color:#8b1648;
  margin:18px 0 7px;
}

.login p{
  color:#888;
  margin-bottom:25px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border:1px solid #ead5de;
  border-radius:11px;
  background:#fffafd;
  font-size:15px;
  outline:none;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#8b1648,#d94b82);
  color:white;
  font-size:15px;
  font-weight:bold;
}

.error{
  color:#d00045;
  margin-top:12px;
}

#dashboard{
  display:none;
}

.header{
  background:#fff;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.brand{
  color:#8b1648;
  font-size:19px;
  font-weight:bold;
}

.logout{
  width:auto;
  padding:9px 16px;
  background:#fff0f5;
  color:#8b1648;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 18px;
}

.welcome h2{
  color:#8b1648;
  margin-bottom:5px;
}

.welcome p{
  color:#777;
  margin-bottom:22px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(139,22,72,.08);
}

.stat span{
  font-size:25px;
}

.stat h3{
  color:#8b1648;
  font-size:25px;
  margin-top:10px;
}

.stat p{
  color:#777;
  font-size:13px;
}

.card{
  background:white;
  padding:22px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(139,22,72,.08);
}

.card h3{
  color:#8b1648;
  margin-bottom:18px;
}

@media(max-width:650px){
  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="login" id="loginPage">

  <div class="login-box">

    <div class="logo">VC</div>

    <h1>Vidhya Collection</h1>

    <p>Premium Admin Panel</p>

    <input
      type="password"
      id="password"
      placeholder="Admin Password"
    >

    <button onclick="login()">Login</button>

    <div class="error" id="error"></div>

  </div>

</div>


<div id="dashboard">

  <div class="header">

    <div class="brand">
      VIDHYA COLLECTION
    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>


  <div class="container">

    <div class="welcome">
      <h2>Welcome, Admin 👋</h2>
      <p>Manage your boutique collection.</p>
    </div>


    <div class="stats">

      <div class="stat">
        <span>🛍️</span>
        <h3>0</h3>
        <p>Total Products</p>
      </div>

      <div class="stat">
        <span>🔥</span>
        <h3>0</h3>
        <p>New Arrivals</p>
      </div>

      <div class="stat">
        <span>💖</span>
        <h3>Active</h3>
        <p>Store Status</p>
      </div>

    </div>


    <div class="card">

      <h3>➕ Add New Product</h3>

      <input
        type="text"
        placeholder="Product Name"
      >

      <select>
        <option>Tops</option>
        <option>Kurtis</option>
        <option>Sarees</option>
        <option>Jeans</option>
        <option>One Piece</option>
        <option>Indo-Western</option>
      </select>

      <input
        type="number"
        placeholder="Price ₹"
      >

      <input
        type="text"
        placeholder="Image filename"
      >

      <button>
        Add Product
      </button>

    </div>


    <div class="card">

      <h3>✨ Quick Management</h3>

      <p style="line-height:2;color:#666;">
        🛍️ Products<br>
        💰 Prices<br>
        🖼️ Images<br>
        🔥 New Arrivals<br>
        📂 Categories
      </p>

    </div>

  </div>

</div>


<script>

function login(){

  var password =
    document.getElementById("password").value;

  if(password === "Vidhya@2026"){

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("dashboard").style.display = "block";

  }else{

    document.getElementById("error").innerHTML =
      "Incorrect password";

  }

}

function logout(){

  document.getElementById("dashboard").style.display = "none";

  document.getElementById("loginPage").style.display = "flex";

  document.getElementById("password").value = "";

}

</script>

</body>
</html>
